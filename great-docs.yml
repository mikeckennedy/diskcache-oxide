# Great Docs configuration for diskcache-oxide.
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# Build with `make docs` (or `python scripts/build_docs.py`), preview with
# `make docs-serve`. The site is mirrored into site/ (committed), not docs/.

display_name: diskcache-oxide

# The original logo has dark strokes; the -dark navbar copy lightens them so they show on
# the dark theme. The orange block is unchanged.
logo:
  light: assets/diskcache-oxide-logo.png
  dark: assets/diskcache-oxide-logo-dark.png
  alt: diskcache-oxide
  show_title: true
favicon: assets/diskcache-oxide-logo.png

hero:
  enabled: true
  logo: assets/diskcache-oxide-slogan.jpg
  logo_height: 480px

social_cards:
  # Absolute: with a relative path, great-docs 0.13.0 points og:image at the site root, where
  # the image is never published (404).
  image: https://mkennedy.codes/docs/diskcache-oxide/assets/diskcache-oxide-slogan.jpg

module: diskcache_oxide
parser: google
dynamic: false

# Subpath hosting: drives Quarto's base path so CSS/JS/nav resolve under the subdirectory.
site_url: "https://mkennedy.codes/docs/diskcache-oxide/"

# The sitemap / robots / canonical base
seo:
  canonical:
    base_url: "https://mkennedy.codes/docs/diskcache-oxide/"

repo: https://github.com/mikeckennedy/diskcache-oxide
github_style: widget
source:
  enabled: true
  branch: main
  path: python/diskcache_oxide
  placement: usage

pypi: true

mcp:
  enabled: false

exclude:
  - _core

user_guide:
  - section: "Get started"
    contents:
      - getting-started.qmd
      - switching-from-diskcache.qmd
      - roadmap.qmd
  - section: "Core Features"
    contents:
      - serialization.qmd
      - null-cache.qmd
      - caches.qmd
      - fanoutcache.qmd
      - transactions.qmd
      - concurrency-and-forks.qmd
      - storage-and-wal.qmd
  - section: "Background & Reference"
    contents:
      - performance.qmd
      - divergences.qmd

sections:
  - title: Recipes
    dir: recipes
    index: true
    navbar_after: User Guide

skill:
  extra_body: skill_extra_body.md
  gotchas:
    - "diskcache-oxide accepts only str keys for now; non-string keys raise TypeError."
    - "pickle is disabled by default: storing unrepresentable types raises TypeError at set time unless Cache(..., pickle=True) is passed."
    - "Reading pickled data with a pickle=False cache raises UnsafeValueError (a TypeError subclass) rather than executing arbitrary unpickle code."
    - "bool(Cache) is always True and Cache.enabled is True (unlike python-diskcache where an empty cache is falsy). bool(NullCache) is False."
    - "diskcache-oxide uses diskcache-oxide.sqlite (not cache.db); it does not read existing diskcache files."
    - "size_limit must be at least 1 MiB (MIN_SIZE_LIMIT); passing smaller raises ValueError."
    - "Timeout inherits from TimeoutError (unlike python-diskcache which only inherits from Exception)."
    - "NullCache behaves as if every entry expires the moment it is written and is instantly swept: get() returns default, set() returns True, volume() is 0."
    - "NullCache(invalidate=real_cache) forwards deletes and clears to the underlying cache while keeping caching off."
  best_practices:
    - "Always use a context manager (with Cache(...) as cache:) or call cache.close() to cleanly return SQLite connections."
    - "Use serializer='msgpack' (the default) for maximum performance and compactness, or serializer='json' if human inspection in SQLite is desired."
    - "Use NullCache in tests or local dev environments to disable caching cleanly without adding conditional checks in application code."
    - "Type application functions that accept either cache type with CacheLike from diskcache_oxide.protocol."
    - "Call cache.checkpoint() at shutdown or from a maintenance job to empty the write-ahead log after write bursts; it returns False rather than raising when other processes keep it busy."
    - "Leave wal_size_limit and sqlite_cache_size at their defaults unless tuning for extreme read-heavy or memory-constrained workloads."
    - "Use Cache(..., on_decode_error='miss') (or a reporting function) so a value that can't be decoded, such as a pickled class that moved, is a miss instead of an exception."
    - "For several worker processes that write often, use FanoutCache(directory, shards=8) (or Caches.register(name, shards=8), read with caches.fanout(name)); shards= is keyword-only and permanent for a directory, and transact(key=...) covers only that key's shard."
    - "Register an app's caches once in a Caches registry and look them up by name (caches['general']); a cache that can't open becomes a NullCache and is retried after 10 seconds."

include_in_header:
  - text: |
      <script async src="https://uma.mkennedy.codes/script.js" data-website-id="fc9b6770-3b44-4073-944e-4a4f0e79f66a"></script>

jupyter: python3

authors:
  - name: Michael Kennedy
    role: Author
    email: michael@mkennedy.tech
    github: mikeckennedy
    homepage: https://mkennedy.codes

reference:
  title: "API Reference"
  desc: >-
    The public API of diskcache-oxide: Cache, FanoutCache, NullCache, the CacheLike, TransactionalCacheLike and ShardedCacheLike protocols,
    the Caches registry, exceptions, and SQLite utilities.
  sections:
    - title: Cache
      desc: "Disk-backed cache backed by SQLite, shared safely across threads and processes."
      contents:
        - Cache
    - title: FanoutCache
      desc: "A cache sharded over several SQLite databases, so writers in many processes stop queueing on one write lock."
      contents:
        - FanoutCache
    - title: NullCache
      desc: "Switched-off cache behaving as if every entry expires instantly."
      contents:
        - NullCache
        - CacheLike
        - TransactionalCacheLike
        - ShardedCacheLike
    - title: Caches
      desc: "A registry of named caches under one base directory."
      contents:
        - Caches
        - CacheStats
    - title: Errors
      desc: "Exceptions raised by cache operations."
      contents:
        - Timeout
        - TransactionBusy
        - UnsafeValueError
        - CorruptValueError
        - ForeignValueError
        - FormatMismatchError
        - LayoutMismatchError
    - title: SQLite and System
      desc: "Information about the bundled SQLite and environment."
      contents:
        - sqlite_version
        - sqlite_compile_options
        - BUNDLED_SQLITE_VERSION
