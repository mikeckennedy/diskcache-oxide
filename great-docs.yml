# Great Docs configuration for diskcache-oxide.
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# Build with `make docs` (or `python scripts/build_docs.py`), preview with
# `make docs-serve`. The site is mirrored into site/ (committed), not docs/.

display_name: diskcache-oxide

# The original logo has dark strokes; the -dark navbar copy lightens them so they show on
# the dark theme. The orange block is unchanged.
logo:
  light: assets/diskcache-oxide-logo.png
  dark: assets/diskcache-oxide-logo-dark.png
  alt: diskcache-oxide
  show_title: true
favicon: assets/diskcache-oxide-logo.png

hero:
  enabled: true
  logo: assets/diskcache-oxide-slogan.jpg
  logo_height: 480px

social_cards:
  # Absolute: with a relative path, great-docs 0.13.0 points og:image at the site root, where
  # the image is never published (404).
  image: https://mkennedy.codes/docs/diskcache-oxide/assets/diskcache-oxide-slogan.jpg

module: diskcache_oxide
parser: google
dynamic: false

# Subpath hosting: drives Quarto's base path so CSS/JS/nav resolve under the subdirectory.
site_url: "https://mkennedy.codes/docs/diskcache-oxide/"

# The sitemap / robots / canonical base
seo:
  canonical:
    base_url: "https://mkennedy.codes/docs/diskcache-oxide/"

repo: https://github.com/mikeckennedy/diskcache-oxide
github_style: widget
source:
  enabled: true
  branch: main
  path: python/diskcache_oxide
  placement: usage

pypi: true

mcp:
  enabled: false

exclude:
  - _core

user_guide:
  - section: "Get started"
    contents:
      - new-to-caching.qmd
      - getting-started.qmd
      - switching-from-diskcache.qmd
      - errors.qmd
      - roadmap.qmd
  - section: "Core Features"
    contents:
      - serialization.qmd
      - null-cache.qmd
      - caches.qmd
      - fanoutcache.qmd
      - transactions.qmd
      - concurrency-and-forks.qmd
      - storage-and-wal.qmd
  - section: "Background & Reference"
    contents:
      - performance.qmd
      - divergences.qmd

sections:
  - title: Recipes
    dir: recipes
    index: true
    navbar_after: User Guide

# The agent skill is hand-written (skills/diskcache-oxide/SKILL.md). Great Docs copies it verbatim to
# skill.md, .well-known/agent-skills/diskcache-oxide/SKILL.md (with index.json from its frontmatter)
# and .well-known/skills/default/SKILL.md, so every link in it is absolute. scripts/build_docs.py
# fails the build if the copy isn't the hand-written file.
skill:
  file: skills/diskcache-oxide/SKILL.md

include_in_header:
  - text: |
      <script async src="https://uma.mkennedy.codes/script.js" data-website-id="fc9b6770-3b44-4073-944e-4a4f0e79f66a"></script>
  # Charts drawn from the markdown tables wrapped in a `.dco-chart` fenced div (the numbers live only in the table).
  - file: ../assets/dco-charts.html

jupyter: python3

authors:
  - name: Michael Kennedy
    role: Author
    email: michael@mkennedy.tech
    github: mikeckennedy
    homepage: https://mkennedy.codes

reference:
  title: "API Reference"
  desc: >-
    The public API of diskcache-oxide: Cache, FanoutCache, NullCache, the CacheLike, TransactionalCacheLike and ShardedCacheLike protocols,
    the Caches registry, exceptions, and SQLite utilities.
  sections:
    - title: Cache
      desc: "Disk-backed cache backed by SQLite, shared safely across threads and processes."
      contents:
        - Cache
    - title: FanoutCache
      desc: "A cache sharded over several SQLite databases, so writers in many processes stop queueing on one write lock."
      contents:
        - FanoutCache
    - title: NullCache
      desc: "Switched-off cache behaving as if every entry expires instantly."
      contents:
        - NullCache
        - CacheLike
        - TransactionalCacheLike
        - ShardedCacheLike
    - title: Caches
      desc: "A registry of named caches under one base directory."
      contents:
        - Caches
        - CacheStats
    - title: Errors
      desc: "Exceptions raised by cache operations."
      contents:
        - Timeout
        - TransactionBusy
        - UnsafeValueError
        - CorruptValueError
        - ForeignValueError
        - FormatMismatchError
        - LayoutMismatchError
    - title: SQLite and System
      desc: "Information about the bundled SQLite and environment."
      contents:
        - sqlite_version
        - sqlite_compile_options
        - BUNDLED_SQLITE_VERSION
