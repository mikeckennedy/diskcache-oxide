[project]
name = "diskcache-oxide"
version = "0.0.0"
description = "A clean-room Rust reimplementation of diskcache."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "diskcache==5.6.3",
]

# The diskcache-community fork, run as a second witness with --backend=community. It installs as
# `diskcache_community`, so it can't shadow diskcache 5.6.3.
community = [
    "diskcache-community==5.8.1",
]

[tool.uv]
default-groups = ["dev", "community"]
# Maturin takes over the build in Phase 1; until then this is a test-only project.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
timeout = 60
# The thread method starts a watchdog thread, which breaks the fork tests.
timeout_method = "signal"
markers = [
    "diverges(backend, ref, reason): expected, documented divergence from diskcache (strict xfail on that backend)",
    "backend_only(*names): only meaningful on the named backends",
    "covers(ref): this test checks the fixed side of a divergence that can't be a strict xfail (diskcache fails it only sometimes)",
    "requires(feature): skipped until the backend supports the feature",
    "slow: heavy stress tests, excluded by default (run with -m slow)",
]
