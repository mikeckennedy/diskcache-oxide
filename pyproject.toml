[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "diskcache-oxide"
dynamic = ["version"]
description = "A shared, durable disk cache for Python, with a Rust engine, SQLite storage, and a diskcache-compatible API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Michael Kennedy", email = "michael@mkennedy.tech" },
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://mkennedy.codes/docs/diskcache-oxide/"
Documentation = "https://mkennedy.codes/docs/diskcache-oxide/"
Repository = "https://github.com/mikeckennedy/diskcache-oxide"
Issues = "https://github.com/mikeckennedy/diskcache-oxide/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "diskcache==5.6.3",
    "ty>=0.0.95",
    "ruff>=0.17.3",
    # Names harness processes (dco-pytest[...], dco-spill-writer, ...); see tests/proctitle.py.
    "setproctitle>=1.3.8",
    "hypothesis>=6.140",
    # Cross-checks FanoutCache's frozen shard hash (tests/unit/test_fanout.py); never a runtime dependency.
    "xxhash>=3.5",
]

# The docs site (`make docs`). Quarto is installed separately and must be on PATH.
docs = [
    "great-docs==0.13.0",
    "ipykernel",
]

# The diskcache-community fork, run as a second witness with --backend=community. It installs as
# `diskcache_community`, so it can't shadow diskcache 5.6.3.
community = [
    "diskcache-community==5.8.1",
]

[tool.uv]
default-groups = ["dev", "community"]
# Rebuild the extension whenever the Rust sources change, not only when pyproject.toml does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
    # The bundled SQLite's compile flags: .cargo/config.toml sets them, and the memory-instrumented
    # build (scripts/check.sh) overrides them through the environment.
    { file = ".cargo/config.toml" },
    { env = "LIBSQLITE3_FLAGS" },
]

[tool.maturin]
python-source = "python"
module-name = "diskcache_oxide._core"
manifest-path = "crates/diskcache-oxide-py/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
timeout = 60
# The thread method starts a watchdog thread, which breaks the fork tests.
timeout_method = "signal"
markers = [
    "diverges(backend, ref, reason): expected, documented divergence from diskcache (strict xfail on that backend)",
    "backend_only(*names): only meaningful on the named backends",
    "covers(ref): this test checks the fixed side of a divergence that can't be a strict xfail (diskcache fails it only sometimes)",
    "requires(feature): skipped until the backend supports the feature",
    "slow: heavy stress tests, excluded by default (run with -m slow)",
]

# Optional imports, each guarded or only used by a tool with its own dependency group: griffe and
# great_docs come with the docs group (scripts/build_docs.py), and the soak worker falls back to
# `resource` when psutil isn't installed.
[tool.ty.analysis]
allowed-unresolved-imports = ["griffe", "great_docs.**", "psutil"]
