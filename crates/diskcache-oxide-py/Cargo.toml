[package]
name = "diskcache-oxide-py"
description = "Python bindings for diskcache-oxide (the diskcache_oxide._core extension module)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
base64.workspace = true
diskcache-oxide-core.workspace = true
libc.workspace = true
pyo3 = { workspace = true, features = ["extension-module"] }
rmp.workspace = true
# Same crate instance as core's; used directly only for the `_sqlite_memory` test hook.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
# Sets cfg(Py_GIL_DISABLED) for this crate, so the codec can snapshot dicts only on free-threaded builds.
pyo3-build-config.workspace = true

[lints]
workspace = true
