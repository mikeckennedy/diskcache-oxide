[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/mikeckennedy/diskcache-oxide"
# Distributed as a Python wheel, not on crates.io.
publish = false

# One version per dependency, declared once. Crates opt in with `foo.workspace = true`.
[workspace.dependencies]
diskcache-oxide-core = { path = "crates/diskcache-oxide-core" }
base64 = "0.22.1"
libc = "0.2.191"
pyo3 = "0.30.1"
pyo3-build-config = "0.30.1"
rmp = "0.8.15"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = "1.0.229"
# float_roundtrip is required: without it about 1 in 1,500 random floats decode one ULP off (Spike 3).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2"
# The model checker for the gate and the write lock, only under `--cfg shuttle` (scripts/model-check.sh).
shuttle = "0.9.9"

# Every crate opts in with:
#   [lints]
#   workspace = true
[workspace.lints.rust]
# deny, not forbid: the py crate's PyO3 macros expand to unsafe code. Core adds #![forbid(unsafe_code)].
unsafe_code = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(shuttle)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"
# Pedantic lints that cost more than they give here.
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep the default panic = "unwind": PyO3 turns a panic into PanicException; abort would kill the interpreter.

# The model checker's builds (scripts/model-check.sh): optimized, with debug assertions and overflow
# checks on, and without the release profile's slow LTO.
[profile.model-check]
inherits = "dev"
opt-level = 3
debug-assertions = true
overflow-checks = true
