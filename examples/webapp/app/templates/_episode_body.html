<div class="mono muted" style="font-size: 14px; margin-top: 24px;">#{{ episode.number }} · {{ episode.published }} · {{ episode.minutes }} min</div>
<h1 style="margin: 8px 0 12px; font-size: 40px; line-height: 1.1;">{{ episode.title }}</h1>
<p class="muted">with {{ episode.guest }}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 32px;">
  {% for t in episode.tags %}<span class="tag">{{ t }}</span>{% endfor %}
</div>
<div class="prose"><p>{{ episode.description }}</p></div>
