line-length = 120
format.quote-style = "single"

# The project requires Python 3.14 (pyproject.toml), which allows `except A, B:`.
target-version = "py314"

# pycodestyle errors, Pyflakes and import sorting. Ruff's default excludes (venv, .venv, build, dist,
# caches) and .gitignore cover what shouldn't be checked; target/ (Cargo) and site/ (the built docs) are
# in .gitignore or hold no Python.
lint.select = ["E", "F", "I"]
